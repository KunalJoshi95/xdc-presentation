## Part A — Verified fact sheet

### A. Physical links and rates

- **F1** [SPEC][MATH] USB4 40G = Gen3 × 2 lanes: 20 Gb/s per lane, 128b/132b encoding →
  ~38.79 Gb/s payload capacity on the wire. (Gen2 lanes use 64b/66b — same ~3% overhead;
  never say "USB4 uses 8b/10b".) — CONFIRMED
- **F2** [SPEC] Thunderbolt 3 = Intel-proprietary 40G; the USB4 spec is based on the TBT3
  protocol Intel contributed. TBT4 = USB4-40G implementation with mandatory extras
  (dual 4K displays, ≥32 Gb/s PCIe, DMA protection). USB4v2/TBT5 = PAM-3, 80G symmetric or
  120/40 asymmetric. — CONFIRMED
- **F3** [MATH] DP link rates, per lane, raw: RBR 1.62 / HBR 2.7 / HBR2 5.4 / HBR3 8.1 Gb/s
  (8b/10b); UHBR10/13.5/20 (128b/132b). Effective ×4-lane payload: HBR2×4 = **17.28**,
  HBR3×4 = **25.92**, UHBR10×4 = 38.79 Gb/s. — CONFIRMED
- **F4** [MATH] 4K60 RGB 8bpc actual video data: CTA-861 timing (594 MHz) = **14.26 Gb/s**;
  CVT-RB2 timing (522.61 MHz) = **12.54 Gb/s**. Use ~12.5–14.3 Gb/s in visuals; ledger
  examples use 12.54. — CONFIRMED

### B. USB-C direct connection (DP Alt Mode) — the "dedicated fabric" baseline

- **F5** [SPEC] A Type-C→DP cable/monitor uses **DP Alt Mode**: raw DP electrical signals on
  the re-purposed SuperSpeed pairs. Pin assignments C/E = all **4 lanes** to DP (only USB 2.0
  remains for data); pin D = 2 lanes DP + USB 3.x. No tunneling, no sharing. — CONFIRMED
- **F6** [SPEC][CODE] While a stream is active, a native/alt-mode DP link always transmits at
  the full trained rate: active pixels, then **stuffing symbols** inside each Transfer Unit,
  and dummy/stuffing during H/V blanking. Link rate ≠ pixel rate; the gap is filled.
  USB4 §10.5 uses one word for both: SST Stuffing Symbols are *"Dummy Symbols during
  horizontal and vertical Blanking and Stuffing Symbols during Active Video"*. At 4K60 on
  HBR3×4 the TU stuffing is the larger share of the gap.
  CAVEAT: say "while a stream is active" (PSR/ALPM can idle the link). — CONFIRMED
- **F7** [SPEC] Two separate link trainings exist in the tunneled world: GPU ↔ DP IN adapter,
  and DP OUT adapter ↔ monitor. The GPU never trains end-to-end "through" the fabric.
  On a direct alt-mode cable there is exactly one training: GPU ↔ monitor. — CONFIRMED

### C. USB4 architecture and terminology

- **F8** [SPEC] Naming: **Host Router** (in the laptop), **Device Router** (hub/dock; a hub
  router has downstream ports). Routers contain **Adapters**: Lane Adapters, Protocol Adapters
  (**DP IN**, **DP OUT**, PCIe, USB3), and a Control Adapter. A **Path** is a sequence of hops
  identified per-link by **HopID**; HopID 0 is exclusively for Control Packets. The
  **Connection Manager (CM)** — software/firmware on the host — enumerates routers and
  configures paths and bandwidth. On Linux the CM is \`drivers/thunderbolt/\`. — CONFIRMED
- **F9** [SPEC] Transport Layer Packet = 4-byte header (HopID, Length, HEC) + **1–256 byte
  variable payload**. Never draw fixed-size cells. Larger protocol data is fragmented and
  reassembled by protocol adapters. — CONFIRMED

### D. The tunneling data plane — the reveal (THE key verified claim)

- **F10** [SPEC] USB4 spec §10.5: *"All Main-Link Stuffing Symbols are discarded by the DP IN
  Adapter and reconstructed by the DP OUT Adapter."* This covers SST dummy symbols during
  blanking, stuffing inside active-video Transfer Units, and MST SF/VCPF fill sequences. —
  CONFIRMED (verbatim spec wording)
- **F11** [SPEC] The DP IN adapter also decodes 8b/10b symbols to 8-bit characters before
  packing — the encoding overhead never crosses the fabric. Kernel comment agrees:
  \`tunnel.c\` *"Tunneling removes the DP 8b/10b 128/132b encoding"* → consumed =
  \`rate × lanes × 8/10\` (legacy) or \`× 128/132\` (UHBR). \`tb_dp_bandwidth()\`,
  \`drivers/thunderbolt/tunnel.c:764-770\`. — CONFIRMED
- **F12** [SPEC] Each tunneled packet carries a **Fill Count** field (§10.5.1.5) telling the
  DP OUT adapter exactly how many stuffing symbols to re-insert; SDPs (audio, infoframes,
  MSA) travel in dedicated Secondary-Data / Blank-Start packet types (§10.5.1.2–10.5.1.4).
  The DP OUT regenerates a full-rate, correctly-timed DP stream for the monitor.
  Field name re-checked against the USB4 2.0 text: §10.5.1 *"the DP IN Adapter includes a
  Fill Count field in each Tunneled Packet"*, and §10.5.1.5 defines it as *"the number of DP
  link clock cycles between two adjacent packets"* — so one field restores both how much
  filler and when. Blank Start packets also carry VB-ID, Mvid and Maud (§10.5.1.3).
  Direction and place, re-checked: §10.5.1 says the Fill Count *"specifies the number of
  Stuffing Symbols that were discarded immediately **preceding** the packet"*, so each packet
  carries the gap before it and DP OUT rebuilds that gap before unpacking the packet. For video
  it sits in each TU Set Header (§10.5.1.2, Figure 10-29), the first 4 bytes of the payload, not
  in the 4-byte transport header. After a video TU it counts FS + stuffing + FE: a TU of 31 data
  symbols in 64 has a Fill Count of 33 (Figure 10-38 A, N + 2). — CONFIRMED
- **F13** [SPEC][MATH] Therefore **fabric bandwidth consumed ≈ actual video data rate**, not
  the trained DP link rate. A 4K60 stream on an HBR3×4-trained tunnel puts ~12.5 Gb/s on the
  fabric, not 25.92. That figure is pixel clock × bpp, so it counts blanking time; active
  pixels alone are ≈11.94 Gb/s (3840 × 2160 × 60 × 24). Say "real video" or "real streams",
  not "real pixels". — CONFIRMED
- **F14** [SPEC] Real-world proof point: Apple Pro Display XDR drives 2 × HBR3 streams
  (would be 51.84 Gb/s of trained-rate data) over a 40G TBT3 cable, because stuffing symbols
  are not transmitted — ~39 Gb/s of real data fits. CAVEAT: it proves the stuffing removal
  (F10–F13), not DP Bandwidth Allocation Mode (F23), which came with USB4. Say it "has leaned
  on the stripped stuffing since 2019". — CONFIRMED

### E. Bandwidth management — legacy "Max Link BW" method

- **F15** [SPEC] CMG §6.2.1 defines two allocation methods. Legacy default: CM reserves
  \`DP link rate × lane count × 0.8\` for the tunnel — *"the video format, resolution and
  blanking scheme used by the DPTX does not affect the bandwidth calculation"* — i.e. the
  reservation ignores stuffing removal even though the data plane strips it. — CONFIRMED
- **F16** [CODE] Linux computes link budget in \`tb_maximum_bandwidth()\`
  (\`drivers/thunderbolt/tb.c:707-792\`): \`link_speed × width × 1000\` Mb/s, then subtracts a
  **10% guard band** → a 40G link exposes **36,000 Mb/s** to tunnels. The guard band exists
  (CMG §6) for link overhead and so bulk traffic (PCIe/USB3) can't be starved. Re-checked on
  drm-tip 7.2 (2026-08-24): *"Leave 10% guard band"*, \`up_bw - up_bw / 10\` (\`tb.c:786-788\`).
  Confirm it on the kernel you demo; the debug line is *"link maximum bandwidth %d/%d Mb/s"*.
  — CONFIRMED
- **F17** [CODE] \`tb_available_bandwidth()\` (\`tb.c:815-856\`) walks every link on the path,
  subtracting USB3 allocations, Gen4 PCIe minimums, and DP consumption; the path's available
  BW is the minimum across hops. — CONFIRMED
- **F18** [CODE] DP tunnels are set up **first-come-first-served**: \`tb_tunnel_dp()\`
  (\`tb.c:2063-2097\`) scans the DP resource list in order and pairs each free DP IN with a
  DP OUT (\`tb_find_dp_out()\`). No global optimizer. — CONFIRMED
- **F19** [CODE] Before creating a DP tunnel the CM frees unused USB3 allocation:
  \`tb_release_unused_usb3_bandwidth()\` (\`tb.c:866-874\`, called at \`tb.c:2012\`), and
  \`tb_reclaim_usb3_bandwidth()\` (\`tb.c:876\`) gives USB3 back what is left afterwards. On the
  stage: "USB3 hands back what it isn't using". The release has a floor: USB3 never drops
  below **900 Mb/s** per direction (\`usb4_usb3_port_release_bandwidth()\`, *"Always keep 900
  Mb/s to make sure xHCI has at least some bandwidth available for isochronous traffic."*;
  Gil Fine, f0b94c1c5c79, v6.7), which DP accounting counts as **1,350 Mb/s** when PCIe
  tunnelling is enabled (×1.5, F42). Every USB4 hub gets a USB3 tunnel whether or not a USB
  device is plugged in (\`tb_tunnel_usb3()\`), so on a hub the DP tunnels share at most
  36,000 − 1,350 = **34,650 Mb/s**. — CONFIRMED
- **F20** [CODE] **Capability clamping**: \`tb_dp_xchg_caps()\` (\`tunnel.c:815-902\`) reads DP IN
  and DP OUT caps, and if the pair's max bandwidth exceeds what the path can carry, calls
  \`tb_dp_reduce_bandwidth()\` which walks a descending table
  \`{8100,4}{5400,4}{8100,2}{2700,4}{5400,2}{8100,1}{1620,4}{5400,1}{2700,2}{1620,2}{2700,1}{1620,1}\`
  and **rewrites the capability registers the GPU will see** — so the GPU link-trains at the
  reduced rate. The clamp happens *before* training. The register is the DP IN adapter's
  \`DP_REMOTE_CAP\` (\`tb_regs.h\`, adapter config offset 0x05; written at \`tunnel.c:910\`); the
  debug line is *"bandwidth reduced to %u Mb/s x%u = %u Mb/s"*. — CONFIRMED
- **F21** [CODE] If even 1620×1 (1,296 Mb/s effective) doesn't fit: \`-ENOSR\`, log
  *"not enough bandwidth"*, DP tunnel activation fails. (In allocation mode a refused request
  logs *"not enough bandwidth available"* instead, \`tb.c:2820\`.) — CONFIRMED
- **F22** [CODE] Teardown/hot-unplug releases the reservation, detaches the bandwidth group,
  recalculates estimated BW for all groups and retries pending DP tunnels
  (\`tb_deactivate_and_free_tunnel\`, \`tb_recalc_estimated_bandwidth\`, \`tb.c:2188-2206\`). — CONFIRMED

### F. Bandwidth management — DP Bandwidth Allocation Mode (the modern method)

- **F23** [SPEC][CODE] Optional granular mode negotiated between CM and the GPU driver via
  **DPCD registers on the DP IN adapter** (0xE0000 range). Required for UHBR tunneling.
  Linux CM support since v6.3, i915/DRM library (\`drm_dp_tunnel.c\`) since v6.9 (Imre Deak). —
  CONFIRMED (per-controller HW support list: only partially public; TBT5/Barlow Ridge yes)
- **F24** [CODE] Detection DPCD registers (\`include/drm/display/drm_dp.h:1458-1533\`):
  \`DP_TUNNELING_CAPABILITIES\` 0xE000D (bit0 TUNNELING_SUPPORT, DP_IN_BW_ALLOCATION_MODE_SUPPORT),
  \`DP_IN_ADAPTER_INFO\` 0xE000E, \`DP_USB4_DRIVER_ID\` 0xE000F,
  \`DP_USB4_DRIVER_BW_CAPABILITY\` 0xE0020, \`DP_IN_ADAPTER_TUNNEL_INFORMATION\` 0xE0021
  (3-bit **Group ID**), \`DP_TUNNELING_STATUS\` 0xE0025,
  \`DP_DPTX_BW_ALLOCATION_MODE_CONTROL\` 0xE0030 (bit7 enable, bit6 unmask IRQ),
  \`DP_REQUEST_BW\` 0xE0031 (one byte, max 255 units). — CONFIRMED
- **F25** [CODE] Granularity is 0.25 / 0.5 / 1 Gb/s (\`usb4_dp_port_granularity()\`,
  \`usb4.c:2831-2857\`). \`tb_dp_bandwidth_alloc_mode_enable()\` starts at 250 and doubles while
  the **DP IN / DP OUT pair's maximum DP bandwidth** (UHBR rates included) would not fit the
  8-bit field (\`tunnel.c:977-987\`); the link budget plays no part. An HBR3×4 pair's
  25,920 / 250 = 103 keeps 250 Mb/s, as does UHBR10 (155) or UHBR13.5 (209); only a UHBR20×4
  pair (77,575 / 250 = 310) moves it to 500. DRM side stores kB/s: 31,250 / 62,500 /
  125,000 kB/s (\`drm_dp_tunnel.c:257-266\`). — CONFIRMED
- **F26** [CODE] CM setup writes: CM ID, Group ID, granularity, **Estimated BW** (available to
  the tunnel, in granularity units), and an initial allocation of 0
  (\`tunnel.c:914-1038\`). — CONFIRMED
- **F27** [CODE] Tunnels sharing the same USB4 links belong to one **bandwidth group**;
  group reservations are counted once per group (\`tb_attach_bandwidth_group\`,
  \`tb_consumed_dp_bandwidth\`, \`tb.c:625-677,1622-1654\`). — CONFIRMED
- **F28** [CODE] Request flow: GPU driver writes unit count to \`DP_REQUEST_BW\` → DP IN raises
  a request to the CM → \`tb_handle_dp_bandwidth_request()\` → \`tb_alloc_dp_bandwidth()\`
  (\`tb.c:2736-2866\`, \`tb.c:2538-2734\`). Requests exceeding the rounded max or path
  availability fail with \`-ENOBUFS\`; the CM writes back the old allocation unchanged:
  *"Write back the same allocated (so no change), this makes the DPTX request fail on
  graphics side."* (verbatim, \`tb.c:2722-2725\`). The CM never silently grants a partial
  amount. — CONFIRMED
- **F29** [CODE] Timing constants: DPCD request completion timeout 3 s (DRM side), CM retries
  a not-yet-active tunnel 3 × every 50 ms (\`TB_BW_ALLOC_RETRIES\`), decreased allocations are
  parked in \`group->reserved\` for **10 s** (\`TB_RELEASE_BW_TIMEOUT\`) before other tunnels can
  grab them, DP CM handshake timeout 3 s. — CONFIRMED
- **F30** [CODE] Completion is reported in \`DP_TUNNELING_STATUS\`: \`DP_BW_REQUEST_SUCCEEDED\` /
  \`DP_BW_REQUEST_FAILED\` (→ \`-ENOSPC\` in DRM), plus \`DP_ESTIMATED_BW_CHANGED\` and
  \`DP_BW_ALLOCATION_CAPABILITY_CHANGED\` notifications (\`drm_dp_tunnel.c:1109-1223,1376-1393\`). — CONFIRMED
- **F31** [CODE] After any allocation change the CM recalculates every group's estimated BW
  and pokes waiting tunnels (\`tb_recalc_estimated_bandwidth\`, \`tb.c:2845-2855\`). — CONFIRMED

### G. The display driver's side (i915 + DRM)

- **F32** [CODE] i915 detects the tunnel during connector probe:
  \`intel_dp_tunnel_detect()\` → \`drm_dp_tunnel_detect()\` (reads the 0xE000x set), then
  \`drm_dp_tunnel_enable_bw_alloc()\` sets 0xE0030 bit7|bit6 (\`intel_dp.c:6331-6344\`,
  \`drm_dp_tunnel.c:820-846,978-998\`). — CONFIRMED
- **F33** [CODE] In atomic check, both SST and MST paths compute the stream's tunnel
  requirement: \`intel_dp_tunnel_atomic_compute_stream_bw()\` →
  \`intel_dp_config_required_rate()\` = f(port clock, lane count, mode clock, hdisplay,
  link bpp; DSC-compressed bpp if DSC) → \`drm_dp_tunnel_atomic_set_stream_bw()\`
  (\`intel_dp_tunnel.c:643-669\`, \`intel_dp.c:2782-2793\`, \`intel_dp_mst.c:803\`). The result is
  pixel clock × bpp × \`drm_dp_bw_overhead()\`, in kB/s; for 3840 px at 24 bpp on four lanes the
  overhead is exactly 1.0 (2,880 symbol cycles per lane, no remainder), so 522,610 kHz gives
  1,567,830 kB/s = 12,543 Mb/s. — CONFIRMED
- **F34** [CODE] Validation sums stream BW per tunnel, rounds up to granularity, caps at the
  DPRX limit, sums per group, and compares to \`group->available_bw\`; overflow →
  \`-ENOSPC\` + failed stream mask (\`drm_dp_tunnel.c:1954-2012\`). — CONFIRMED
- **F35** [CODE] **The retry loop**: on \`-ENOSPC\` i915 calls
  \`intel_link_bw_reduce_bpp(state, limits, failed_stream_mask, "DP tunnel link BW")\` and
  returns \`-EAGAIN\` → the whole link config is recomputed with lower bpp until it fits or
  modes are pruned (\`intel_dp_tunnel.c:725-740\`, \`intel_link_bw.c:153-166\`). Which stream: the
  one with the highest link bpp among the failed streams — every stream in the group — and on
  a tie the lowest pipe, which may be a display that was already running
  (\`__intel_link_bw_reduce_bpp()\`; a bpp forced through debugfs is kept until nothing else is
  left). How: the recompute tries **uncompressed first**, down to 6 bpc (18 bpp), and uses
  **DSC only when even that does not fit** (\`intel_dp_compute_link_for_joined_pipes()\`; HDMI
  sinks behind a PCON prefer DSC to 6 bpc). So "reduce" usually means fewer bits per pixel,
  not DSC. — CONFIRMED
- **F36** [CODE] Actual allocation happens at commit: \`intel_dp_tunnel_atomic_alloc_bw()\` =
  decrease old allocations, then increase new ones; a failed allocation on a connected sink
  queues a modeset retry (\`intel_dp_tunnel.c:742-837\`). \`drm_dp_tunnel_alloc_bw()\` calls
  \`allocate_tunnel_bw()\`, which rounds up to granularity with \`DIV_ROUND_UP\`, writes
  \`DP_REQUEST_BW\` and waits ≤3 s (\`drm_dp_tunnel.c:1149-1225\`). — CONFIRMED
- **F37** [CODE] Runtime estimated-BW drops (another tunnel joined the group) arrive as
  \`DP_TUNNELING_IRQ\` → \`drm_dp_tunnel_handle_irq()\` → connector **reprobe** (epoch bump);
  the next atomic check applies the normal \`-ENOSPC\`→reduce-bpp path. No instant forced
  mode-drop in the IRQ handler itself. — CONFIRMED

### H. QoS, priorities and the "who wins on the wire" question

- **F38** [SPEC] USB4 egress scheduling (§5.3.3): weighted-round-robin among Paths in the same
  Priority Group, **strict priority across 8 groups (Group 0 highest)**; HopID-0 control
  traffic is exclusively Group 0; flow-control and time-sync outrank everything. — CONFIRMED
- **F39** [SPEC][CODE] Recommended (CMG Table 6-1) and Linux-implemented priorities:
  **DP Main-Link = 1, DP AUX = 2, PCIe = 3 (weight 1), USB3 = 3 (weight 2), Host-DMA = 5**
  (\`tunnel.c:19-63\`). DP video traffic is classified **isochronous**; PCIe/USB3 are bulk. —
  CONFIRMED
- **F40** [SPEC] Reservation is **admission control only** — reserved-but-unused DP bandwidth
  is usable by PCIe/USB3 bulk traffic. Never say reserved bandwidth is "dead". — CONFIRMED

### I. PCIe and USB3 tunnels

- **F41** [CODE] **PCIe tunnels have no bandwidth accounting**: no consumed-bandwidth
  callback (\`tb_tunnel_alloc_pci()\`, \`tunnel.c:532-568\`); kernel comment *"PCIe and DMA
  tunnels do not consume guaranteed bandwidth"* (\`tb_deactivate_and_free_tunnel()\`,
  \`tb.c:1762-1765\`). PCIe rides best-effort at priority 3 on leftover +
  guard-band capacity. Exception: USB4v2 (Gen4) links reserve a fixed **1,500 Mb/s** PCIe
  minimum each direction (\`tb_tunnel_reserved_pci\`, \`USB4_V2_PCI_MIN_BANDWIDTH\`). — CONFIRMED
- **F42** [CODE] USB3 tunnels ARE accounted: \`tb_usb3_consumed_bandwidth()\` scales the USB3
  allocation by weight — with PCIe enabled, effective = allocated × (2+1)/2 = **×1.5**.
  Gen4 links guarantee USB3 ≥ 3,000 Mb/s each direction. USB3 allocation scales dynamically
  and unused USB3 BW is lent to new DP tunnels (F19), down to a 900 Mb/s floor on any link:
  900 × 1.5 = **1,350 Mb/s** of the budget with PCIe on. — CONFIRMED
- **F43** [SPEC] An MST dock = **one** tunnel, one reservation (per-monitor split happens
  inside the DP stream as MST VC payload — invisible to USB4 accounting). A hub with two
  DP OUT adapters = **two** tunnels needing two DP IN adapters on the host. MST fill
  sequences (SF/VCPF) are also stripped on the fabric. USB4 §10 requires a host router to
  have at least one DP IN; two is typical, and the kernel's KUnit host model has two
  (\`drivers/thunderbolt/test.c\`, ports 5 and 6). — CONFIRMED

### J. Worked ledger scenarios (all arithmetic re-verified)

Setup for all: USB4 Gen3×2 link = 40,000 Mb/s raw → CM budget **36,000 Mb/s** (F16).
Hub also carries a USB3 tunnel (idle → released for DP down to its 900 Mb/s floor, which
counts as **1,350** with PCIe on, F19/F42) and a PCIe SSD/eGPU (never reserved, F41). So the
DP tunnels share 36,000 − 1,350 = 34,650. The USB4 CM Guide's own example (§6.2.1.1: 40 − 4 −
25.92 = 10.08, second link constrained to 8.64) leaves USB3 out; the figures below keep it in,
because the Linux CM does.

- **F44** [MATH][CODE] **Scenario 1 — one 4K monitor, legacy mode.** Monitor caps HBR3×4.
  Reservation = 8100×4×0.8 = **25,920**. Remaining = 36,000 − 1,350 − 25,920 = **8,730**.
  Actual fabric traffic for 4K60 ≈ 12.54 Gb/s (F4/F13); PCIe bursts use the rest of the
  wire opportunistically (F40/F41). — CONFIRMED
- **F45** [MATH][CODE] **Scenario 2 — second 4K monitor, legacy mode.** Wants HBR3×4 = 25,920
  > 8,730 → \`tb_dp_reduce_bandwidth()\` walks the table (F20): 25,920 ✗ → 17,280 ✗ →
  12,960 ✗ → **{2700,4} = 8,640 ✓** (90 to spare). The CM rewrites DP-IN caps to HBR×4; the
  GPU trains at 2.7G×4. But 4K60 8bpc needs 12.54 Gb/s > 8,640, and 9.41 even at 6 bpc →
  i915 can only light 4K60 with **DSC**, or falls back (4K30 ≈ 6.3 Gb/s / 1440p60 ≈ 5.8 Gb/s,
  CVT-RB timings). Both screens light up; the second is silently degraded. Total reserved:
  1,350 + 25,920 + 8,640 = 35,910 ≤ 36,000 — the same total as the example in Gil Fine's
  f0b94c1c5c79 (1,350 + 2 × 17,280). — CONFIRMED
- **F46** [MATH][CODE] **Scenario 3 — same two monitors, BW Allocation Mode.** Granularity
  250 Mb/s (the adapters' HBR3×4 maximum, 25,920/250 = 103 ≤ 255, F25; the Estimated BW the CM
  writes for the first tunnel is 34,650/250 = 138 units, F26). i915 computes required rate per
  stream (F33): 4K60 ≈ 12,540 → ⌈12,540/250⌉ = 51 units = **12,750 Mb/s** each.
  Two displays: 1,350 + 25,500 = 26,850 ≤ 36,000 ✓ — **both run full uncompressed 4K60**.
  Remaining: **9,150 Mb/s**. On stage, say the rounding once ("rounded up to the allocation
  step") so 12.54 → 12.75 is not a drift. The rate depends on the panel's timing: a
  533.25 MHz CVT-RB mode needs 12,798 → 52 units = 13,000 each, 26,000 for two, 8,650 free,
  and DSC 8 bpp 4,266 → 18 units = 4,500. Real panels' figures are in the tb log
  (*"requested bandwidth %d Mb/s"*) and DRM's (*"Allocating %d/%d Mb/s for tunnel"*). — CONFIRMED
- **F47** [MATH][CODE] **Scenario 4 — overshoot.** A third 4K60 on its own tunnel needs 12,750
  against 9,150 free. DRM's atomic check sums the group, rounding each tunnel up
  (\`drm_dp_tunnel.c:1961\`), against the group's available BW, derived from the CM's Estimated
  BW → \`-ENOSPC\`, and no request goes out → \`intel_link_bw_reduce_bpp()\` (F35) lowers the
  highest-bpp stream, on a tie the lowest pipe (display 1), uncompressed first: 6 bpc =
  522.61 MHz × 18 = 9,407 → 38 units = **9,500**. Still over (1,350 + 9,500 + 12,750 + 12,750 =
  36,350), so the next pass lowers display 2 too: 1,350 + 9,500 + 9,500 + 12,750 = 33,100 ≤
  36,000, **2,900** free. DSC comes in only if 6 bpc is not enough; 4K60 at DSC 8 bpp is
  522.61 × 8 = 4,181 → 17 units = 4,250. A request that does reach the CM and does not fit
  gets \`-ENOBUFS\`, the old allocation written back, \`DP_BW_REQUEST_FAILED\` → DRM \`-ENOSPC\`,
  and a modeset retry (F28/F36). The CM never over-commits isochronous budget. CAVEAT: a
  third tunnel needs a third free DP IN adapter (F43) and a DP OUT for it. A third display
  over MST inside an existing tunnel is refused first by the MST link, not the CM: at 24 bpp
  i915 sizes a 4K60 stream at 32 of HBR3×4's 63 time slots (1,870 PBN at 60 PBN a slot, with
  the 0.6% SSC margin), so two do not fit and the MST check reduces one of them. The talk
  states only the rule, without these numbers. — CONFIRMED

  the fabric (F10–F13): 2 × ~12.5 = ~25 Gb/s of video; (b) admission control clamps or
  granularly allocates (F20/F28) so the isochronous budget of 36,000 is never oversubscribed;
  (c) the DP OUT adapters regenerate both full-rate 8.1×4 streams at the far end (F12).
  Close against the budget the talk built, not the wire: two streams granted 25,500 of
  36,000 (F46). — CONFIRMED

### K. Original-concept corrections (MUST honor in the video)

- **F49** CORRECTED — "*a PCIe device consumes/reserves 10 Gb/s*": PCIe tunnels are never
  bandwidth-reserved (F41). Show PCIe as best-effort bursts that yield to DP. The contention
  drama comes from **two displays + guard band**, not from a PCIe reservation.
  (TBT3's famous "22G for PCIe" was a controller implementation limit, not a reservation.)
- **F50** CORRECTED — "*17 Gb/s 4K display*": 17.28 = HBR2×4 **trained-link reservation**
  (legacy accounting), while the 4K60 stream itself needs ~12.5 Gb/s. Keep both numbers but
  label them correctly: "reserved" vs "actual".
- **F51** CORRECTED — "*Host controller strips and only active data is sent*": TRUE for the
  data plane (F10–F13) — but must be paired with the reservation story (F15/F23), otherwise
  viewers can't explain why a second display ever gets clamped. Both halves are the answer.
- **F52** CAVEAT — "*8.1×4 = 32 Gb/s*": 32.4 raw; **25.92 Gb/s effective** after 8b/10b.
  On-screen: show "32.4 Gb/s raw / 25.92 Gb/s data".

## Part B — Do-NOT-claim list (fact-checked misconceptions)

1. ✗ "A DP tunnel always consumes its trained link rate on the fabric" — only the legacy
   *reservation* is trained-rate-based; consumption is actual data (F13/F15).
2. ✗ "Reserved bandwidth is wasted/dead" — bulk reuses it (F40).
3. ✗ "PCIe reserves 10G/22G" (F49).
4. ✗ "USB4 packets are fixed 256-byte cells" — variable 1–256 B payload (F9).
5. ✗ "Two HBR3 monitors can't work because 64.8 > 40" — and equally, don't show the CM
   happily reserving 2×25.92 on one 40G link (F45/F48).
6. ✗ "DP alt mode is tunneling / shares with USB3" — 4-lane alt mode leaves only USB 2.0 (F5).
7. ✗ "USB4 uses 8b/10b" — Gen2 64b/66b, Gen3 128b/132b (F1).
8. ✗ "The GPU link-trains end-to-end with the monitor through the fabric" — two trainings (F7).
9. ✗ "MST hub = two USB4 tunnels" — one tunnel; two DP OUTs = two tunnels (F43).
10. ✗ "The DP link always transmits" without the "while a stream is active" caveat (F6).

## Part C — Narration script (voiceover, per scene; fact refs inline)

> Timing is elastic — the webpage lets the viewer pause and change speed per animation.
> Lines are written to survive pauses: each sentence lands on a visual beat.
> This is the original voiceover. The captions now live in each beat's \`narration\`
> (\`src/scenes/\`), and the live talk is \`speaker-words.md\`; SC5–SC6 below are updated
> to match them.

### SC1 — The Hook
- "This laptop has one USB-C port. This is a Thunderbolt hub." [visual: snap, snap]
- "The cable between them moves data at forty gigabits per second." [water flow] (F1)
- "Now we connect two 4K monitors. Each one link-trains at 8.1 gigabits, times four lanes —
  32.4 gigabits raw, 25.92 of data, each." (F3, F52)
- "Two displays. Nearly 65 gigabits of trained links. One 40-gigabit cable." (F48)
- "And yet — both light up. Full resolution. How? That's the question this page answers."

### SC2 — Baseline: a dedicated pipe
- "Rewind to the simplest setup: laptop, monitor, one USB-C-to-DisplayPort cable." (F5)
- "This is DP Alt Mode — the USB-C connector hands all four high-speed lane pairs to raw
  DisplayPort. No sharing. Only USB 2.0 is left over." (F5)
- "The GPU and the monitor link-train directly — one training, end to end." (F7)
- "Inside: four lanes, governed by the display driver. The entire fabric belongs to display."
- "Pixels travel as an SST stream — or MST, if the monitor daisy-chains." (F43)
- "And here's a detail we'll need later: while a stream is active, this link never goes
  quiet. Active pixels… then stuffing symbols… blanking… dummy data. The trained rate is
  transmitted, always. 25.92 gigabits of capacity, whether the frame needs it or not." (F6)

### SC3 — The shared fabric
- "Now the second setup: the Thunderbolt hub. Downstream: a monitor, a USB drive, an eGPU."
- "Same cable — completely different contents. Let's go inside." [zoom]
- "This is USB4: everything becomes tunneled packets — a tiny four-byte header, up to 256
  bytes of payload." (F9)
- "Blue: DisplayPort. Green: USB 3. Orange: PCIe. Gold, on HopID zero: control." (F8, F9)
- "At the hub, adapters de-capsulate each protocol and hand it to its port: DP to the
  monitor, USB to the drive, PCIe to the eGPU." (F8)
- "One fabric. Three protocols. Shared. Which brings the obvious question…"

### SC4 — Who arbitrates?
- "Meet the Connection Manager — on Linux, it's \`drivers/thunderbolt\` in the kernel." (F8)
- "Rule one: the CM takes the 40-gigabit link and keeps a 10% guard band — tunnels can
  reserve at most 36,000 megabits." (F16)
- "Rule two: only isochronous traffic reserves. DisplayPort reserves. USB 3 reserves.
  PCIe never does — it's bulk, best-effort." (F39, F41, F49)
- "Rule three: on the wire, strict priority. DP video rides priority 1; PCIe and USB3 share
  priority 3. Video is never starved by a file copy." (F38, F39)
- "But reservation is admission control, not a wall — unused reserved bandwidth is happily
  used by PCIe bursts." (F40)
- [Scenario, legacy mode] "First 4K monitor: caps say HBR3 by four. The CM reserves rate ×
  lanes × 0.8 — 25,920 megabits. USB3 keeps its 1,350, so 8,730 remain." (F15, F19, F44)
- "Second monitor: wants the same 25,920. It doesn't fit. Watch what the CM does *before*
  the GPU ever trains: \`tb_dp_xchg_caps\` walks a fallback table — 25,920… 17,280… 12,960…
  8,640 fits — and rewrites the capabilities the GPU will read. The GPU trains at HBR×4,
  never knowing it was clamped." (F20, F45)
- "But 4K60 needs 12.5 gigabits — more than 8,640, and 9.4 even at 6 bits a colour. A DSC
  monitor could compress; most drop to 4K30. Both screens light — one is quietly degraded.
  Legacy mode is blunt." (F45)
- [Scenario, BW Allocation Mode] "The modern way: DP Bandwidth Allocation Mode. The GPU
  driver and the CM negotiate through DPCD registers on the DP IN adapter." (F23, F24)
- "i915 computes what the mode actually needs — 12,540 megabits for 4K60 — rounds up to
  250-megabit granules: 51 units, 12,750." (F25, F33, F46)
- "It writes 51 into REQUEST_BW. The CM checks the path… grants. Second display: grants.
  25,500 of 36,000 used, 9,150 still free. Both displays: full, uncompressed 4K60." (F28, F46)
- [Overshoot] "Push it — a third 4K stream, 12,750 against 9,150 free. Refused: DRM checks
  the group against the manager's estimate and gets ENOSPC." (F28, F47)
- "i915 doesn't give up: \`intel_link_bw_reduce_bpp\` lowers the richest stream — display 1 —
  to 6 bits a colour, 9,500, and checks again: still over. Then display 2: 33,100 of 36,000.
  Granted. That loop — request, refuse, reduce, retry — is bandwidth arbitration on Linux."
  (F35, F47)

### SC5 — The reveal
- "So back to the paradox. First, remember the direct cable: trained at 8.1 by four, it
  transmits 25.92 gigabits of data — always — and most of a 4K60 frame's slots are stuffing
  and blanking around 12.5 gigabits of real video." (F6, F4, F13)
- "Now the tunnel. The USB4 spec, section 10.5, says it plainly: 'All Main-Link Stuffing
  Symbols are discarded by the DP IN Adapter and reconstructed by the DP OUT Adapter.'" (F10)
- "The DP IN adapter in the laptop takes the GPU's full-rate stream, strips the 8b/10b
  coding, drops every stuffing symbol — and notes in each packet a Fill Count: how much it
  threw away." (F11, F12)
- "Only real data crosses the fabric: pixels, control, audio." (F13)
- "At the hub, the DP OUT adapter replays the Fill Counts — rebuilding the exact full-rate,
  correctly-timed 8.1-by-four stream the monitor expects. The monitor can't tell the
  difference." (F12)

### SC6 — Resolution
- "Two trained links: 64.8 gigabits on paper. Two real streams: 25.5 gigabits granted, in a
  budget of 36. It fits. A third display? Request, refuse, reduce, retry." (F16, F46, F47,
  F48)
- "Both monitors light up because two things are true at once: the fabric carries only real
  data — and a manager makes sure real data is never over-promised." (F51)
- "That's DisplayPort tunneling: a full-rate illusion at both ends, honest arithmetic in the
  middle."
- [Proof-point card] "Apple's Pro Display XDR has leaned on the stripped stuffing since
  2019: two HBR3 streams through one 40-gigabit Thunderbolt 3 cable." (F14)

## Appendix A — Linux call flow (verified, drm-tip)

\`\`\`
Hotplug / link-service IRQ
  intel_dp_detect()
    └─ intel_dp_tunnel_detect() ── drm_dp_tunnel_detect()          [DPCD 0xE000D..]
         └─ drm_dp_tunnel_enable_bw_alloc()                        [0xE0030 ← bit7|bit6]
Atomic check
  intel_dp_tunnel_atomic_compute_stream_bw()
    └─ intel_dp_config_required_rate()                             [mode → Mb/s]
  drm_dp_tunnel_atomic_check_stream_bws()                          [sum, round, group cmp]
    └─ -ENOSPC → intel_link_bw_reduce_bpp() → -EAGAIN → recompute  [DSC / lower bpp]
Commit
  intel_dp_tunnel_atomic_alloc_bw()  = decrease old → increase new
    └─ drm_dp_tunnel_alloc_bw()                                    [0xE0031 ← units, wait ≤3s]
         CM: tb_handle_dp_bandwidth_request() → tb_alloc_dp_bandwidth()
             ok → SUCCEEDED; else write back old alloc → FAILED (-ENOSPC)
  modeset enable → DP IN strips stuffing (F10) → DP OUT regenerates
CM housekeeping
  tb_recalc_estimated_bandwidth() → DP_ESTIMATED_BW_CHANGED IRQ → reprobe

for the stuffing before it. That’s why 12.75 was enough. At the hub, DP OUT reads each receipt and rebuilds exactly that much stuffing. The monitor can’t tell.",notes:'The spec’s sentence (USB4 §10.5, F10): "All Main-Link Stuffing Symbols are discarded by the DP IN Adapter and reconstructed by the DP OUT Adapter." Watch DP IN first: each Transfer Unit arrives as its active data, then its stuffing. The hollow stuffing falls into the gutter while the fill count climbs, 0 to 33; then the next run of active data goes in, four lanes squeezed into one payload, and the packet comes out header first, carrying that count (F9). The empty stretch of fabric in front of every header is exactly the stuffing its count stands for. Fill Count is the field’s real name (USB4 2.0 §10.5.1): "the number of Stuffing Symbols that were discarded immediately preceding the packet". It is in the TU Set Header, the first 4 bytes of the payload, not in the 4-byte USB4 header, so the count rides the packet. After a 4K60 TU it is 33: 31 of 64 symbols are data, and the rest is stuffing with its FS and FE (§10.5.1.5). The meter drains as the packets cross: the GPU still sends 25.92, and about 12.5 of it crosses, under the 12.75 granted. If asked for the exact figure: the pixels alone are 11.94 (3840 × 2160 × 60 × 24); each TU adds a 4-byte TU Set header and each packet of up to 256 bytes a 4-byte USB4 header, about 12.52 in all. 12.54 is pixel clock × bpp, the figure the driver asks for. Then DP OUT: each header drops into the gutter — the USB4 header is dropped at the adapter, never forwarded — the count runs down 33 to 0 as that much hollow stuffing is rebuilt onto the lanes, and then the payload comes out as the same four lanes of active data. DP OUT has to read a count before it can rebuild it, so it holds the stream about a TU’s stuffing and a header behind DP IN: its lanes are DP IN’s, symbol for symbol, at the full trained rate, a fixed delay later (F12). The physical encoding comes off at DP
